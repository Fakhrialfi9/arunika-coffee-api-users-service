name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: arunika_coffee_users
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run prisma:generate

      - name: Deploy database schema
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run prisma:deploy

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run typecheck

      - name: Unit tests
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run test

      - name: CRUD integration tests
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run test:e2e

      - name: gRPC integration tests
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run test:grpc

      - name: Security baseline tests
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run test:security

      - name: Build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users
        run: npm run build
