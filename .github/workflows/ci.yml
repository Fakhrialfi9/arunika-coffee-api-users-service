name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: arunika_coffee_users
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test

      # --------------------------------
      # APPLICATION
      # --------------------------------
      APP_NAME: arunika-coffee-api-users-service
      APP_HOST: 0.0.0.0
      APP_PORT: 3000

      # --------------------------------
      # DATABASE
      # --------------------------------
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: arunika_coffee_users
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/arunika_coffee_users

      # --------------------------------
      # GRPC USERS
      # --------------------------------
      GRPC_USERS_HOST: 127.0.0.1
      GRPC_USERS_PORT: 50051
      USERS_GRPC_TIMEOUT_MS: 3000

      # --------------------------------
      # SECURITY
      # --------------------------------
      SECURITY_CORS_ORIGINS: http://localhost:3000
      SECURITY_RATE_LIMIT_TTL: 60000
      SECURITY_RATE_LIMIT_MAX: 100
      SECURITY_BODY_LIMIT: 1mb
      SECURITY_GRPC_MAX_MESSAGE_BYTES: 1048576
      SECURITY_TRUST_PROXY: loopback

      # --------------------------------
      # LOGGING
      # --------------------------------
      LOG_ENABLED: true
      LOG_LEVEL: debug

      # --------------------------------
      # OPENTELEMETRY
      # --------------------------------
      OTEL_SERVICE_NAME: arunika-coffee-api-users-service
      OTEL_TRACING_ENABLED: false
      OTEL_TRACES_SAMPLER_ARG: 1
      OTEL_METRICS_ENABLED: false
      OTEL_METRIC_EXPORT_INTERVAL: 60000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Deploy database schema
        run: npm run prisma:deploy

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: CRUD integration tests
        run: npm run test:e2e

      - name: gRPC integration tests
        run: npm run test:grpc

      - name: Security baseline tests
        run: npm run test:security

      - name: Build
        run: npm run build
