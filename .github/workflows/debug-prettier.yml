name: Debug Prettier

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/users/repositories/user.repository.ts
      - run: git diff --no-ext-diff --unified=20 -- src/domain/users/repositories/user.repository.ts
