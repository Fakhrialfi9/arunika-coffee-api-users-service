name: Debug Prettier

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/application/users/services/create-user.service.spec.ts src/application/users/services/get-user.service.spec.ts src/application/users/services/list-users.service.spec.ts src/application/users/services/list-users.service.ts
      - run: git diff --no-ext-diff --unified=5 -- src/application/users/services/create-user.service.spec.ts src/application/users/services/get-user.service.spec.ts src/application/users/services/list-users.service.spec.ts src/application/users/services/list-users.service.ts
